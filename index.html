<!doctype html>
<html lang="ja">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="theme-color" content="#254f42">
 <meta name="description" content="問題集の正誤を記録し、今日の学習と復習予定を確認できます。">
 <title>問題集管理</title>
 <meta name="apple-mobile-web-app-title" content="問題集管理">
 <link rel="icon" href="./favicon.ico?v=1" sizes="16x16 32x32 48x48 64x64">
 <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=1">
 <link rel="stylesheet" href="./styles.css?v=calendar-overview-2">
 <script type="module" src="./app.js?v=calendar-overview-2"></script>
</head>
<body>
 <div class="app">
  <header class="app-header"><span>問題集管理</span><span class="seed" aria-hidden="true"></span></header>
  <div id="storage-alert" role="alert" hidden></div>
  <main id="main"></main>
  <nav class="bottom-nav" aria-label="メインナビゲーション">
   <button type="button" data-tab="home"><span data-icon="home"></span><span>ホーム</span></button>
   <button type="button" data-tab="input"><span class="input-blob" data-icon="pencil"></span><span>入力</span></button>
   <button type="button" data-tab="calendar"><span data-icon="calendar"></span><span>カレンダー</span></button>
  </nav>
 </div>
 <div id="toast" role="status" aria-live="polite" hidden></div>
 <dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-body"></div></dialog>
 <noscript>このアプリを使うには、ブラウザーのJavaScriptを有効にしてください。</noscript>
</body>
</html>
